<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <title>Workspace Staff Manager</title>
</head>
<body>

    <main class="flex p-2 sm:p-4 overflow-y-auto order-1">
    
   <div id="floor-plan-area"
     class="relative shadow-2xl rounded-xl ml-3 w-[93%] h-[30vh]  lg:h-[92vh] lg:w-[78%] lg:ml-30 md:w-[80%] md:ml-20  border-4 border-blue-500 bg-no-repeat bg-center"
     style="background-image: url('./imgs/plan.jpg'); background-size: contain;">

        <div class="absolute top-0 left-0 w-full h-full grid grid-cols-20 grid-rows-6 gap-1 md:gap-2">
            
            <!-- zone conference diiv -->
            <div id="zone-conference" class="zone-area col-span-8 row-span-2 lg:col-span-8 bg-gray-500/50 hover:bg-gray-700/50   flex flex-col justify-between items-center p-1 md:p-2 text-center text-white font-bold border border-white/40 relative text-xs md:text-sm" data-zone="conference">
                <span>Conference Room</span>
                <button class="add-employee-zone-btn p-1 bg-white text-gray-800 rounded-full w-6 h-6 md:w-8 md:h-8 flex justify-center items-center shadow-md hover:bg-gray-200 text-xs md:text-sm opacity-80" >
                    <i class="fas fa-plus"></i>
                </button>
            </div> 

            <!--zone server div -->

            <div id="zone-server" class="zone-area row-span-2 col-start-12 col-end-16 text-white bg-gray-500/50 hover:bg-gray-700/50 flex flex-col justify-between items-center p-1 md:p-2 text-center text- font-bold border border-white/40 relative text-xs md:text-sm" data-zone="reception">
                <span>Server</span>
                <button class="add-employee-zone-btn p-1 bg-white text-gray-800 rounded-full w-6 h-6 md:w-8 md:h-8 flex justify-center items-center shadow-md hover:bg-gray-200 text-xs md:text-sm opacity-80" title="Add Employee">
                    <i class="fas fa-plus"></i>
                </button>
            </div> 

            <!-- zone staff room  -->

            <div id="zone-staff-room" class="zone-area col-span-8 row-span-4 col-start-1 row-start-3 bg-gray-500/50 hover:bg-gray-700/50 flex flex-col justify-between items-center p-1 md:p-2 text-center text-white font-bold border border-white/40 relative text-xs md:text-sm" data-zone="staff-room">
                <span>Staff Room</span>
                <button class="add-employee-zone-btn p-1 bg-white text-gray-800 rounded-full w-6 h-6 md:w-8 md:h-8 flex justify-center items-center shadow-md hover:bg-gray-200 text-xs md:text-sm opacity-80" title="Add Employee">
                    <i class="fas fa-plus"></i>
                </button>
            </div> 


            <!-- zone security div  -->

            <div id="zone-security" class="zone-area row-span-2 col-start-16 col-end-21 text-white bg-gray-500/50 hover:bg-gray-700/50 flex flex-col justify-between items-center p-1 md:p-2 text-center font-bold border border-white/40 relative text-xs md:text-sm" data-zone="security">
                <span>Security Room</span>
                <button class="add-employee-zone-btn p-1 bg-white text-gray-800 rounded-full w-6 h-6 md:w-8 md:h-8 flex justify-center items-center shadow-md hover:bg-gray-200 text-xs md:text-sm opacity-80" title="Add Employee">
                    <i class="fas fa-plus"></i>
                </button>
            </div> 


            <!-- zone reception div -->

            <div id="zone-reception" class="zone-area row-span-2 row-start-5  col-start-12 col-end-16  bg-gray-500/50 hover:bg-gray-700/50 flex flex-col justify-between items-center p-1 md:p-2 text-center text-white font-bold border border-white/40 relative text-xs md:text-sm" data-zone="archives">
                <span>Reception Room</span>
                <button class="add-employee-zone-btn p-1 bg-white text-gray-800 rounded-full w-6 h-6 md:w-8 md:h-8 flex justify-center items-center shadow-md hover:bg-gray-200 text-xs md:text-sm opacity-80" title="Add Employee">
                    <i class="fas fa-plus"></i>
                </button>
            </div> 

        </div>

    </div>
</main>
    

    <script src="./script.js"></script>
</body>
</html>
